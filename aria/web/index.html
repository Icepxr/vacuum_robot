      <nav class="side-nav" id="side-nav">
        <button type="button" data-page="home"><span data-icon="home" aria-hidden="true"></span><span class="nav-label">หน้าหลัก</span></button>
        <button type="button" data-page="review"><span data-icon="review" aria-hidden="true"></span><span class="nav-label">ยืนยันค่า<span class="nav-desktop">มิเตอร์</span></span><em id="nav-review-count"></em></button>

        <button type="button" data-page="settings"><span data-icon="settings" aria-hidden="true"></span><span class="nav-label">ตั้งค่า</span></button>

      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="top-left"><span class="mobile-logo logo-window"><img src="img/aria-logo.png" alt="ARIA"></span><span class="top-brand">ARIA</span><span class="top-divider">/</span><span id="top-page-name">หน้าหลัก</span></div>
        <div class="top-right">
          <span class="cycle-nav"><button type="button" class="cycle-btn" data-cycle-step="-1" aria-label="รอบก่อน">‹</button><span class="cycle-tag"><span data-icon="calendar" aria-hidden="true"></span> <span id="cycle-name">—</span></span><button type="button" class="cycle-btn" data-cycle-step="1" aria-label="รอบถัดไป">›</button></span>

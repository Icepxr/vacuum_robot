; ─────────────────────────────────────────────────────────────
; MRC-001 — ESP32-S3 N16R8
;
; มี 2 environment แยกกัน เพราะแต่ละอันมี setup()/loop() ของตัวเอง
;   wifi_test          — โค้ดเดิม (ทดสอบต่อ Wi-Fi)
;   motor_encoder_test — ชุดทดสอบ M1 มอเตอร์ + เอ็นโคดเดอร์
;
; สั่งบิลด์ทีละอัน:  pio run -e motor_encoder_test -t upload -t monitor
; ─────────────────────────────────────────────────────────────

[platformio]
default_envs = motor_encoder_test

[env]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; ⚠ ยังไม่ตัดสินใจ — ต้องยืนยันก่อนบิลด์ motor_encoder_test
; `platform = espressif32` ตัวทางการของ PlatformIO ให้ Arduino core 2.0.x
; (ESP-IDF 4.4) ซึ่ง "ไม่มี" driver/pulse_cnt.h ที่ system_architecture.md §3.6
; ล็อกไว้เป็นวิธีกันตัวนับ PCNT ล้น  → โค้ดจะฟ้อง #error ตอนคอมไพล์
;
; ถ้าฟ้องจริง ให้เปลี่ยนไปใช้ platform ของชุมชนที่ให้ Arduino core 3.x
; (เลือก release ล่าสุดเองจาก https://github.com/pioarduino/platform-espressif32/releases
;  แล้วใส่ลิงก์ไฟล์ .zip ของ release นั้น) เช่น:
;
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<TAG>/platform-espressif32.zip
;
; ผมยังไม่ได้ทดสอบบิลด์บนเครื่องนี้ (Mac เครื่องนี้ไม่มี PlatformIO ติดตั้ง)
; → ถือว่าข้อนี้ยัง [ยังไม่ยืนยัน] จนกว่าจะบิลด์ผ่านจริงบนเครื่อง Windows

[env:wifi_test]
build_src_filter = -<*> +<main.cpp>

[env:motor_encoder_test]
build_src_filter = -<*> +<motor_encoder_test/>

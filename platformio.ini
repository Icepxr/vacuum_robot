; ─────────────────────────────────────────────────────────────
; MRC-001 — ESP32-S3 N16R8
;
; มี 2 environment แยกกัน เพราะแต่ละอันมี setup()/loop() ของตัวเอง
;   (wifi_test ถูกย้ายไป archive/firmware_wifi_test — 21 ก.ย. 2026)
;   motor_encoder_test — ชุดทดสอบ M1 มอเตอร์ + เอ็นโคดเดอร์
;   blower_test        — ชุดทดสอบ M3 ระบบดูดและปัด (blower + แปรง)
;   servo_test         — ชุดทดสอบ M2 เซอร์โวเสายก (วัดช่วงหมุนจริง)
;   robot              — **เฟิร์มแวร์รวม** M1+M2+M3 ในตัวเดียว คุมผ่าน Serial ด้วย prefix
;                        (m / sv / bl) + interlock ตาม 08_การคำนวณ/18
;
; สั่งบิลด์ทีละอัน:  pio run -e robot -t upload -t monitor   (ขาทุกขาอยู่ที่ src/pins.h)
; ─────────────────────────────────────────────────────────────

[platformio]
default_envs = robot

[env]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; หมายเหตุเรื่อง Arduino core (ตรวจแล้ว 5 ก.ย. 2026)
; `platform = espressif32` ตัวทางการของ PlatformIO ให้ Arduino core 2.0.x (ESP-IDF 4.4)
; ซึ่ง "ไม่มี" driver/pulse_cnt.h ที่ system_architecture.md §3.6 ล็อกไว้เป็นวิธี
; กันตัวนับ PCNT ล้น → env motor_encoder_test จึงต้องปักเวอร์ชัน platform เอง
; (ดู [env:motor_encoder_test] ข้างล่าง)


[env:motor_encoder_test]
; ปักเวอร์ชันเพื่อให้ได้ Arduino core 3.x (ESP-IDF v5) ตามที่ §3.6 ล็อกไว้
; release 55.03.311 = Arduino 3.3.11 บน ESP-IDF 5.5.5
; ที่มา: https://github.com/pioarduino/platform-espressif32/releases/latest (ตรวจ 5 ก.ย. 2026)
; ⚠ ยังไม่ได้บิลด์ทดสอบจริง — ถ้าดาวน์โหลดหรือคอมไพล์ไม่ผ่าน ให้เลือก release อื่นจากหน้าเดียวกัน
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_src_filter = -<*> +<motor_encoder_test/>

[env:blower_test]
; ชุดทดสอบระบบดูด (M3) — ใช้ core 3.x เหมือน motor_encoder_test
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_src_filter = -<*> +<blower_test/>

[env:servo_test]
; ชุดทดสอบเซอร์โวเสายก (M2) — วัดช่วงหมุนจริงเพื่อปิด C8
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_src_filter = -<*> +<servo_test/>

[env:robot]
; เฟิร์มแวร์รวม — รวมสามชุดทดสอบไว้ในไบนารีเดียว ไม่ต้องแฟลชสลับไปมาตอนประกอบ
; ROBOT_MERGED ปิด setup()/loop() ของแต่ละชุดทดสอบ แล้วให้ src/robot/main.cpp เป็นเจ้าของแทน
; ชุดทดสอบเดิมทั้งสาม env ยังแฟลชแยกได้เหมือนเดิมทุกอย่าง (ใช้ตอนต้องการผลวัดที่เทียบกับของเก่าได้)
; interlock และที่มาของตัวเลข: 08_การคำนวณ/18_interlock_เฟิร์มแวร์รวม.md
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_flags = ${env.build_flags} -D ROBOT_MERGED -D BOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi   ; N16R8 = octal PSRAM (sprite ของจอ 115 kB อยู่ใน PSRAM)
lib_deps = lovyan03/LovyanGFX@^1.2.0        ; จอกลม GC9A01 (src/robot/tft.cpp · C32) — ดึงครั้งแรกต้องมีเน็ต
build_src_filter = -<*> +<robot/> +<motor_encoder_test/> +<blower_test/> +<servo_test/>
